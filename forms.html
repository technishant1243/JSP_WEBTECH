<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>

    <fieldset>
    <h1></h1>
    <form>
        <label for="USERNAME">username</label>
        <input type="text" name="username" id="username" placeholder="ENTER USERNAME" value="">

        <label for="email" type="text">EMAIL</label>
        <input type="text" name="username" id="email" placeholder="">
<br>
        <input type="sumbit">
        <button>Sumbit</button>
<br>
<br>
        <input type="password" name="password" id="password" placeholder="ENTER YOUR PASSWORD">


<br>
<hr>
<br>
<br>


<label for="gender">GENDER</label>
<input type="radio" name="gender" id="male" value="male" />

<label for="female">FEMALE</label>
<input type="radio" name="gender" id="female" value="female"/>



<br>
<hr>

<label for="country">COUNTRY</label>
<select name="country" id="country">
    <option  value="" disabled selected>select a country</option>
    <option value="india">INDIA</option>
    <option value="china">CHINA</option>
    <option value="us">USA</option>
    <option value="pakistan">PAKISTAN</option>
    <!-- <option value=""></option> -->

</select>





<br>
<br>

<label for="courses">COURSES</label>
<input type="text" name="courses" id="courses" list="sub">

<datalist id="sub">
    <option value="mern">MERN STACK</option>
    <option value="Java">JAVA</option>
    <option value="javascript">javascript</option>
</datalist>


<br>
<label for="resume">RESUME</label>
<input type="file" name="resume"  multiple>
        
    </form>


    <label for="address">Address</label>
    <textarea name="address" id="address"></textarea>

    <br>

    <label for="coding">coding</label>
    <input type="checkbox" name="hobbies" id="coding" value="coding">

    <label for="gaming">GAMING</label>
    <input type="checkbox" name="hobbies" id="gaming" value="gaming">

    <br>

    <label for="phoneno">PHONE NO</label>
    <input type="tel" name="phoneno" id="phoneno" maxlength="10" minlength="10">
    

    <br>
    <br>
    <label for="time">CHOOSE TIME SLOT</label>
    <input type="time" name="time" id="time">
<hr>

    <label for="favcolor">FAV COLOR</label>
    <input type="color" name="favcolor" id="favcolor">

    <br>
<label for="week">SELECT A WEEK</label>
<input type="week" name="week" id="week"> 
<br>

<label for="date"></label>
<input type="date" name="date" id="date">

</fieldset>

</body>
</html>
