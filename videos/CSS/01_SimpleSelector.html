    <!--
    THERE ARE 5 TYPES
    1.ID:USED TO TARGET ELEMENT UNIQELY REPRESENTED AS #(UNIQELY target)
    2.CLASS:USED TO TARGET MULTIPLE SIMLAR OR DIFFRENT ELEMENTS,REPRESENTED AS DOT(.)

    4.GROUP:USED TO GROUP MULTIPLE ELEMENTS REPRESENTED AS A COMMA(,)
